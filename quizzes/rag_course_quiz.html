<h2 class="sr-only">RAG Course Review Quiz — 35 multiple choice questions across 6 modules</h2>
<style>
  :root {
    --accent: #5DCAA5;
    --accent-dark: #0F6E56;
    --accent-bg: #E1F5EE;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-sans);
  }

  #quiz-app {
    padding: 1rem 0;
  }

  .module-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1.5rem;
  }

  .tab-btn {
    padding: 6px 12px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    color: var(--color-text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tab-btn:hover {
    background: var(--color-background-secondary);
  }

  .tab-btn.active {
    background: #E1F5EE;
    color: #0F6E56;
    border-color: #5DCAA5;
    font-weight: 500;
  }

  .module-label {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-bottom: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .q-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  .q-text {
    font-size: 15px;
    color: var(--color-text-primary);
    margin-bottom: 1rem;
    line-height: 1.6;
    font-weight: 500;
  }

  .q-num {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-bottom: 6px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-secondary);
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    color: var(--color-text-primary);
    line-height: 1.5;
    transition: all 0.12s;
  }

  .opt-btn:hover:not(:disabled) {
    border-color: #5DCAA5;
    background: #E1F5EE;
    color: #0F6E56;
  }

  .opt-btn.correct {
    background: #EAF3DE;
    border-color: #639922;
    color: #3B6D11;
  }

  .opt-btn.wrong {
    background: #FCEBEB;
    border-color: #E24B4A;
    color: #A32D2D;
  }

  .opt-btn.reveal {
    background: #EAF3DE;
    border-color: #639922;
    color: #3B6D11;
    opacity: 0.7;
  }

  .opt-letter {
    font-weight: 500;
    min-width: 18px;
  }

  .feedback {
    margin-top: 10px;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: var(--border-radius-md);
    line-height: 1.5;
  }

  .feedback.correct {
    background: #EAF3DE;
    color: #3B6D11;
  }

  .feedback.wrong {
    background: #FCEBEB;
    color: #A32D2D;
  }

  .score-bar {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    padding: 12px 16px;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 14px;
    color: var(--color-text-secondary);
  }

  .score-num {
    font-size: 20px;
    font-weight: 500;
    color: #0F6E56;
  }

  .reset-btn {
    margin-left: auto;
    padding: 6px 14px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    color: var(--color-text-secondary);
    font-size: 13px;
    cursor: pointer;
  }

  .reset-btn:hover {
    background: var(--color-background-secondary);
  }
</style>

<div id="quiz-app">
  <div class="module-tabs" id="tabs"></div>
  <div class="score-bar">
    <div><span class="score-num" id="score-display">0</span> / <span id="total-display">5</span> correct</div>
    <button class="reset-btn" onclick="resetModule()">Reset module</button>
  </div>
  <div class="module-label" id="module-label"></div>
  <div id="questions"></div>
</div>

<script>
  const modules = [
    {
      title: "Module 1<br>Introduction",
      label: "What is RAG, how to set it up locally, and why it matters",
      questions: [
        {
          q: "What core problem does Retrieval-Augmented Generation (RAG) solve that a standard LLM cannot?",
          opts: ["It makes LLMs run faster on consumer hardware", "It allows LLMs to reason about private or up-to-date data without retraining the model", "It replaces the need for a vector database entirely", "It eliminates hallucinations completely"],
          ans: 1,
          exp: "LLMs have a fixed training cutoff and no access to private data. RAG solves this by retrieving relevant context at query time and injecting it into the prompt."
        },
        {
          q: "In a RAG pipeline, what is the role of the 'retriever' component?",
          opts: ["It generates the final answer using a language model", "It finds and returns the most relevant document chunks for a given query", "It converts raw documents into plain text", "It scores and ranks the LLM's output for accuracy"],
          ans: 1,
          exp: "The retriever searches a vector index (like FAISS) for document chunks that are semantically closest to the user's query, passing them as context to the LLM."
        },
        {
          q: "Which of the following best describes why RAG is often preferred over fine-tuning for incorporating new information?",
          opts: ["Fine-tuning is always more expensive than RAG", "RAG updates are faster — you add documents to the index rather than retraining model weights", "Fine-tuned models cannot answer questions", "RAG produces longer answers than fine-tuned models"],
          ans: 1,
          exp: "Fine-tuning requires significant compute and time to update model weights. With RAG, you simply add or update documents in the vector store — no retraining needed."
        },
        {
          q: "What does 'grounding' mean in the context of RAG?",
          opts: ["Connecting the model to the internet", "Ensuring the LLM's answer is based on retrieved source documents rather than memorized training data", "Reducing the model's token usage", "Encrypting the documents in the vector store"],
          ans: 1,
          exp: "Grounding means anchoring the LLM's response to specific retrieved passages, reducing hallucination by giving the model concrete evidence to reason from."
        },
        {
          q: "A company has a large internal HR policy document updated monthly. Which approach is most practical for keeping an AI assistant current with policy changes?",
          opts: ["Retrain the LLM every month with the new document", "Fine-tune the model on each new policy version", "Update the vector index with the new document chunks — no model changes needed", "Ask employees to paste policy text into every prompt"],
          ans: 2,
          exp: "RAG shines here: re-ingest the updated document, rebuild or update the FAISS index, and the assistant immediately has access to current policy — no model retraining required."
        }
      ]
    },

    {
      title: "Module 1<br>Code Setup",
      label: "Setup — Python 3.13 constraints",
      questions: [
        {
          q: "Why is creating a Python virtual environment strongly recommended before installing RAG dependencies?",
          opts: ["It makes Python run faster", "It isolates project packages from system Python, preventing version conflicts", "It is required by Docker Model Runner", "It automatically installs FAISS"],
          ans: 1,
          exp: "Virtual environments keep your project's packages self-contained. Without one, installing conflicting versions of libraries across projects can break your system Python installation."
        },
        {
          q: "Which command creates and activates a virtual environment named .venv on macOS/Linux?",
          opts: ["pip install venv && venv activate", "python -m venv .venv  then  source .venv/bin/activate", "virtualenv create .venv  then  .venv start", "conda create --name .venv"],
          ans: 1,
          exp: "python -m venv .venv creates the environment; source .venv/bin/activate switches your shell into it. On Windows the activate path is .venv\\Scripts\\activate."
        },
        {
          q: "On an Apple Silicon Mac (M1/M2/M3), the environment variable KMP_DUPLICATE_LIB_OK=TRUE is sometimes needed. What issue does this address?",
          opts: ["It enables GPU acceleration for FAISS", "It suppresses a duplicate OpenMP library conflict that can crash certain numpy/FAISS operations on ARM", "It increases the Python stack size", "It tells Docker to use the ARM image layer"],
          ans: 1,
          exp: "Apple Silicon Macs can load multiple copies of the OpenMP runtime, causing a fatal error. Setting KMP_DUPLICATE_LIB_OK=TRUE suppresses that crash — it's a workaround, not a fix."
        },
        {
          q: "Which file is the standard way to declare Python package dependencies so the project is reproducible on another machine?",
          opts: ["packages.json", "setup.cfg", "requirements.txt", "dependencies.py"],
          ans: 2,
          exp: "requirements.txt lists package names and optional version pins (e.g. faiss-cpu>=1.9.0). Running pip install -r requirements.txt on another machine installs all listed packages."
        },
        {
          q: "After activating a virtual environment, a developer runs pip install langchain-community but gets a permissions error. What is the most likely cause?",
          opts: ["The package doesn't exist on PyPI", "The virtual environment was not properly activated — pip is pointing at the system Python", "FAISS must be installed first", "Python 3.13 doesn't support LangChain"],
          ans: 1,
          exp: "If the venv isn't activated, pip installs into the system Python path, which often requires elevated permissions. Activating the venv first ensures packages install into the local .venv folder."
        }
      ]
    },
    {
      title: "Module 2<br>Docker Model Runner",
      label: "Docker Model Runner & demo",
      questions: [
        {
          q: "What is Docker Model Runner's primary role in a local RAG application?",
          opts: ["It manages the FAISS vector index files", "It hosts and serves AI models (embedding and chat) locally via an API endpoint — no cloud required", "It orchestrates the LangChain pipeline", "It converts documents to text chunks"],
          ans: 1,
          exp: "Docker Model Runner runs AI models in containers and exposes them on a local endpoint (e.g. localhost:12434). This lets your Python app call them using the OpenAI SDK format without any cloud API keys."
        },
        {
          q: "What is the OpenAI-compatible base URL you would configure your Python code to use when calling a model hosted in Docker Model Runner?",
          opts: ["https://api.openai.com/v1", "http://localhost:12434/engines/llama.cpp/v1", "http://127.0.0.1:8080/model", "http://docker-hub.internal/v1"],
          ans: 1,
          exp: "Docker Model Runner exposes models at http://localhost:12434/engines/llama.cpp/v1 by default. Because it's OpenAI-compatible, you just point the base_url there and your existing SDK calls work unchanged."
        },
        {
          q: "Which Docker CLI command pulls the llama3.2 model to be used with Docker Model Runner?",
          opts: ["docker pull llama3.2", "docker model pull ai/llama3.2", "docker run ai/llama3.2", "docker compose up llama3.2"],
          ans: 1,
          exp: "docker model pull ai/llama3.2 downloads the model image from Docker Hub into Model Runner's local model store, making it available to serve."
        },
        {
          q: "In the RAG app, TWO separate models are run in Docker Model Runner. What are their respective roles?",
          opts: ["One for chunking documents, one for storing the index", "One embedding model (e.g. ai/embeddinggemma) to convert text to vectors, one chat model (e.g. ai/llama3.2) to generate answers", "One for retrieval, one for reranking", "One for English, one for other languages"],
          ans: 1,
          exp: "The embedding model converts query text and document chunks into vectors for similarity search. The chat model (LLM) receives the retrieved context and the user's question and generates the final answer."
        },
        {
          q: "What key privacy advantage does running both models in Docker Model Runner provide over using cloud APIs?",
          opts: ["It makes the models faster", "Your documents and queries never leave your local machine — no data is sent to external servers", "The models are more accurate locally", "Docker Model Runner supports more model types than cloud APIs"],
          ans: 1,
          exp: "With Docker Model Runner, all inference happens on your own hardware. Sensitive documents (HR policies, patient data, proprietary IP) stay entirely within your network or machine — a critical advantage for regulated industries."
        }
      ]
    },
    {
      title: "Module 3<br>Data Conversion",
      label: "Data — raw conversion",
      questions: [
        {
          q: "What is 'chunking' in the context of preparing documents for a RAG pipeline?",
          opts: ["Compressing documents into smaller file sizes", "Splitting documents into smaller overlapping text segments for indexing", "Encrypting documents before storage", "Converting PDFs to images"],
          ans: 1,
          exp: "Chunking breaks large documents into smaller pieces (e.g. 500 tokens with 50-token overlap) so each chunk fits in the LLM's context window and represents a focused topic."
        },
        {
          q: "Why is chunk overlap important when splitting documents?",
          opts: ["It reduces the total number of vectors stored", "It ensures that information near chunk boundaries isn't lost or split across unrelated chunks", "It speeds up embedding generation", "It is required by the FAISS index format"],
          ans: 1,
          exp: "Without overlap, a sentence straddling two chunk boundaries gets split between them. Overlap (e.g. 50 tokens) ensures that boundary content appears in both chunks, improving retrieval accuracy."
        },
        {
          q: "Which LangChain class is commonly used to split plain text into chunks by character count with overlap?",
          opts: ["RecursiveCharacterTextSplitter", "DocumentLoader", "FAISSTextChunker", "ParagraphSplitter"],
          ans: 0,
          exp: "RecursiveCharacterTextSplitter splits text by trying paragraph, sentence, and character separators in order, creating chunks of a target size with configurable overlap."
        },
        {
          q: "A developer loads a 200-page PDF and creates 1,800 text chunks. Each chunk is then passed to an embedding model. What does the embedding model output for each chunk?",
          opts: ["A compressed version of the text", "A fixed-length numerical vector representing the semantic meaning of that chunk", "A keyword index of the chunk", "A summary of the chunk"],
          ans: 1,
          exp: "Embedding models transform text into dense numeric vectors (e.g. 768 or 1024 dimensions) that encode semantic meaning. Similar meanings produce vectors that are close together in vector space."
        },
        {
          q: "When converting raw source documents (PDFs, Word files, text files) for RAG ingestion, which step comes FIRST?",
          opts: ["Generate embeddings", "Create the FAISS index", "Extract plain text from the source files", "Chunk the text"],
          ans: 2,
          exp: "Before you can chunk or embed, you need clean plain text. Extraction (using libraries like pypdf, docx2txt, etc.) converts binary formats into text that the pipeline can process."
        }
      ]
    },
    {
      title: "Module 4<br>Data Ingestion and Index Creation",
      label: "Ingest & index creation",
      questions: [
        {
          q: "What type of data structure does FAISS use to enable fast similarity search?",
          opts: ["A relational B-tree index", "A hash table of keywords", "A vector index that stores and searches dense numerical embeddings", "A full-text inverted index like Elasticsearch"],
          ans: 2,
          exp: "FAISS (Facebook AI Similarity Search) is a library specifically designed to index and search large collections of dense vectors using algorithms like flat L2, IVF, and HNSW."
        },
        {
          q: "In LangChain, which method is used to create a FAISS vector store from a list of document chunks?",
          opts: ["FAISS.load_local()", "FAISS.from_documents()", "FAISS.create_index()", "VectorStore.build()"],
          ans: 1,
          exp: "FAISS.from_documents(chunks, embedding_model) takes your text chunks, runs each through the embedding model, and builds and returns a searchable FAISS index in one step."
        },
        {
          q: "After building a FAISS index, a developer saves it to disk. What is the PRIMARY reason for persisting the index?",
          opts: ["FAISS indices must be saved before they can be searched", "Embedding 1,800 chunks takes significant time — saving the index avoids re-embedding every time the app restarts", "The index file is required by Docker Model Runner", "Saving compresses the vectors to save memory"],
          ans: 1,
          exp: "Embedding generation is computationally expensive. Saving the FAISS index (index.faiss + index.pkl) means you only embed documents once; subsequent runs load the pre-built index instantly."
        },
        {
          q: "What does allow_dangerous_deserialization=True do when loading a FAISS index in LangChain, and why is it required?",
          opts: ["It enables GPU acceleration for the index", "It bypasses a safety check on pickle-based index files — needed because LangChain uses pickle format which can execute arbitrary code", "It increases retrieval result count", "It allows the index to accept non-UTF-8 text"],
          ans: 1,
          exp: "FAISS indexes are saved using Python's pickle format. LangChain warns that pickle files can contain arbitrary code, so it requires explicit opt-in with allow_dangerous_deserialization=True when loading from trusted sources."
        },
        {
          q: "A developer rebuilds the FAISS index but forgets to use the same embedding model that was used to create it. What will happen at query time?",
          opts: ["The index will rebuild automatically using the correct model", "Queries will return random results because query vectors and index vectors occupy incompatible vector spaces", "The application will refuse to start", "Results will be slightly less accurate but still correct"],
          ans: 1,
          exp: "Embeddings are model-specific. If the index was built with model A and queries are embedded with model B, the vector dimensions or learned space won't match — results will be meaningless or cause errors."
        }
      ]
    },

    {
      title: "Module 5<br>RAG Chain Walkthrough",
      label: "Code walkthrough & demo",
      questions: [
        {
          q: "In a LangChain RAG chain, what does RunnablePassthrough accomplish?",
          opts: ["It skips the retrieval step", "It passes the original user question through the chain unchanged so it can be used alongside retrieved context", "It caches the LLM response", "It formats the final output as plain text"],
          ans: 1,
          exp: "RunnablePassthrough forwards the input (the user's question) to the next stage without modification. In a RAG chain this ensures the question reaches the prompt template alongside the retrieved docs."
        },
        {
          q: "What is a CrossEncoder reranker and why is it added after initial FAISS retrieval?",
          opts: ["It re-embeds all documents in the index for improved accuracy", "It takes the top-k retrieved chunks and the original query together and re-scores them for relevance — more accurate than vector similarity alone", "It filters out duplicate chunks from the FAISS results", "It compresses chunks before sending them to the LLM"],
          ans: 1,
          exp: "Bi-encoder (FAISS) retrieval is fast but approximate. A CrossEncoder re-scores each candidate chunk by looking at the query and chunk together, significantly improving result relevance at the cost of a bit more compute."
        },
        {
          q: "In the app.py code, what is the purpose of the score_threshold parameter when calling FAISS as a retriever?",
          opts: ["It sets the maximum number of results returned", "It filters out document chunks whose similarity score falls below the threshold — only sufficiently relevant chunks pass to the LLM", "It controls the LLM's temperature", "It limits the number of tokens per chunk"],
          ans: 1,
          exp: "score_threshold sets a minimum relevance bar. Chunks below the threshold are discarded even if they're the top results, preventing the LLM from being fed loosely-related or irrelevant context."
        },
        {
          q: "Looking at a LangChain LCEL chain like: chain = {'context': retriever, 'question': RunnablePassthrough()} | prompt | llm | StrOutputParser(). What does StrOutputParser do at the end?",
          opts: ["It splits the LLM output into structured JSON", "It converts the LLM's raw message object into a plain Python string", "It filters profanity from the answer", "It sends the response back to the vector store"],
          ans: 1,
          exp: "LangChain LLMs return message objects (AIMessage), not raw strings. StrOutputParser extracts the .content string from the message, making it easy to display or process downstream."
        },
        {
          q: "Why does the RAG app set the LLM's base_url to the Docker Model Runner endpoint rather than using the real OpenAI API URL?",
          opts: ["The OpenAI SDK only works with local URLs", "Docker Model Runner exposes an OpenAI-compatible API, so pointing base_url at it redirects calls to the local model without changing any other code", "It is required by LangChain's ChatOpenAI class", "To enable streaming responses"],
          ans: 1,
          exp: "Docker Model Runner intentionally mimics the OpenAI REST API format. By changing only base_url and api_key='ollama' (or similar placeholder), the exact same ChatOpenAI calls go to local models instead of OpenAI's servers."
        }
      ]
    },
    {
      title: "Module 6<br>Local vs Cloud RAG",
      label: "Local vs cloud RAG — final",
      questions: [
        {
          q: "A healthcare organization wants to build a RAG assistant over patient records. Which deployment approach is most appropriate and why?",
          opts: ["Cloud RAG using OpenAI — lower latency", "Local RAG — patient data is protected health information (PHI) that must not leave the organization's network", "Either works equally — RAG is always HIPAA compliant", "Cloud RAG using a VPC endpoint is the only compliant option"],
          ans: 1,
          exp: "PHI is protected under HIPAA. Sending patient records to third-party cloud APIs creates compliance and legal risk. Local RAG keeps all data on-premises — the safest default for healthcare data."
        },
        {
          q: "A startup wants to build a customer-facing RAG chatbot with thousands of concurrent users and no in-house GPU hardware. Which is the better fit?",
          opts: ["Local RAG on a developer laptop", "Cloud RAG (e.g. OpenAI + Pinecone) — scales on demand without hardware investment", "Local RAG on a single server", "Neither — RAG cannot handle concurrent users"],
          ans: 1,
          exp: "Cloud RAG services scale horizontally. For high-concurrency public products where hardware procurement isn't practical, cloud APIs offer the simplest scaling path — at the cost of ongoing per-token billing and data leaving your system."
        },
        {
          q: "What is the primary hardware constraint that limits which LLMs can be run locally with Docker Model Runner?",
          opts: ["The version of Docker installed", "Available RAM and VRAM — models must fit in memory to run", "The number of CPU cores", "The size of the FAISS index on disk"],
          ans: 1,
          exp: "LLMs must be loaded entirely (or in quantized form) into RAM/VRAM to run. A 7B parameter model in 4-bit quantization needs ~4–6GB; larger models require more. This is the dominant hardware bottleneck for local inference."
        },
        {
          q: "Model quantization (e.g. 4-bit or 8-bit) is used in local RAG deployments primarily to:",
          opts: ["Improve the model's accuracy on specialized domains", "Reduce the model's memory footprint so it can run on hardware with less RAM/VRAM", "Speed up the FAISS index search", "Encrypt the model weights for security"],
          ans: 1,
          exp: "Quantization reduces the precision of model weights (e.g. from 32-bit floats to 4-bit integers), shrinking memory requirements by 4–8x with modest accuracy tradeoffs — making large models practical on consumer hardware."
        },
        {
          q: "A developer is comparing local RAG and cloud RAG for a use case processing 10 million document queries per month. What is the key economic argument FOR local RAG at this scale?",
          opts: ["Local models always give better answers", "At high query volume, the fixed cost of local hardware is amortized across queries — cloud API costs scale linearly and can become very expensive", "Cloud APIs charge per document, not per query", "Local RAG doesn't require chunking"],
          ans: 1,
          exp: "Cloud LLM APIs charge per token. At millions of queries/month, those costs compound rapidly. Once local hardware is purchased, marginal cost per query approaches zero — making local RAG economically favorable at high scale."
        }
      ]
    }
  ];

  let current = 0;
  let state = modules.map(m => m.questions.map(() => null));

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = modules.map((m, i) =>
      `<button class="tab-btn ${i === current ? 'active' : ''}" onclick="switchModule(${i})">${m.title}</button>`
    ).join('');
  }

  function switchModule(i) {
    current = i;
    renderTabs();
    renderQuestions();
    updateScore();
  }

  function updateScore() {
    const answered = state[current].filter(s => s !== null);
    const correct = state[current].filter(s => s === true);
    document.getElementById('score-display').textContent = correct.length;
    document.getElementById('total-display').textContent = modules[current].questions.length;
    document.getElementById('module-label').textContent = modules[current].label;
  }

  function renderQuestions() {
    const mod = modules[current];
    const qs = document.getElementById('questions');
    qs.innerHTML = mod.questions.map((q, qi) => {
      const answered = state[current][qi];
      return `<div class="q-card">
      <div class="q-num">Question ${qi + 1} of ${mod.questions.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.opts.map((opt, oi) => {
        let cls = '';
        if (answered !== null) {
          if (oi === q.ans) cls = oi === q.ans ? 'correct' : 'reveal';
          if (answered === false && oi !== q.ans) cls = '';
        }
        const isSelected = answered !== null;
        return `<button class="opt-btn ${cls}" 
            ${isSelected ? 'disabled' : `onclick="answer(${qi}, ${oi})"`}
            style="${isSelected && oi !== q.ans && cls === '' ? 'opacity:0.5' : ''}">
            <span class="opt-letter">${String.fromCharCode(65 + oi)}.</span>
            <span>${opt}</span>
          </button>`;
      }).join('')}
      </div>
      ${answered !== null ? `<div class="feedback ${answered ? 'correct' : 'wrong'}">
        ${answered ? '✓ Correct. ' : '✗ Not quite. '}${q.exp}
      </div>` : ''}
    </div>`;
    }).join('');
  }

  function answer(qi, chosen) {
    const q = modules[current].questions[qi];
    state[current][qi] = chosen === q.ans;
    renderQuestions();
    updateScore();
  }

  function resetModule() {
    state[current] = modules[current].questions.map(() => null);
    renderQuestions();
    updateScore();
  }

  renderTabs();
  renderQuestions();
  updateScore();
</script>
